name: Website preview checks
on:
  pull_request:
    paths:
      - 'website/**'
      - 'src/biosignal_lab/**'
      - '.github/workflows/website.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate and verify synthetic reference payloads
        run: |
          python -m pip install -r website/requirements-demo.txt -e . pytest
          python website/scripts/scenarios.py
          python -m pytest website/test/test_scenarios.py
      - name: Build and exercise desktop and mobile browsers
        working-directory: website
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
