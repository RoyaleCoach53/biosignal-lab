name: Website preview checks
on:
  pull_request:
    paths:
      - 'website/**'
      - 'src/biosignal_lab/**'
      - '.github/workflows/website.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate and verify synthetic reference payloads
        run: |
          python -m pip install -r website/requirements-demo.txt -e ".[app]" pytest
          python website/scripts/scenarios.py
          python -m pytest website/test/test_scenarios.py
      - name: Build and exercise desktop and mobile browsers
        working-directory: website
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
          npm run test:studio
      - name: Verify actual Studio browser-to-Python execution
        working-directory: website
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
          SITE_STUDIO_URL: 'http://127.0.0.1:8503'
          BIOSIGNAL_STUDIO_SOURCE_ROOT: '/tmp/biosignal-studio-test-inputs'
          SITE_STUDIO_SOURCE_ROOT: '/tmp/biosignal-studio-test-inputs'
        run: |
          mkdir -p "$SITE_STUDIO_SOURCE_ROOT"
          python -m streamlit run ../studio_app.py --server.headless true --server.address 127.0.0.1 --server.port 8503 > /tmp/biosignal-studio.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(120):
              try:
                  with urlopen("http://127.0.0.1:8503/_stcore/health", timeout=1) as response:
                      if response.read() == b"ok":
                          break
              except OSError:
                  pass
              time.sleep(.25)
          else:
              raise SystemExit("Studio did not become healthy within 30 seconds")
          PY
          npm run test:studio-backend
