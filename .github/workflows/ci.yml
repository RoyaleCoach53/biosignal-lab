name: Tests and numerical verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and all test integrations
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]" build
          python -m pip check
      - name: Original tests and release regressions (MNE and dashboard included)
        run: python -m pytest -ra --junitxml=ci-results/tests.xml
      - name: Numerical reference checks
        run: python benchmarks/verify.py --output ci-results/numerical.json
      - name: Critical Python lint and compilation
        run: |
          python -m ruff check --select E9,F63,F7,F82 src tests app.py benchmarks examples tools
          python -m compileall -q src app.py benchmarks examples tools
          python tools/check_docs.py
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ci-results/
            dist/
          retention-days: 30
