name: Verified release artifacts

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish this approved version using the protected pypi environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,all,formats]"
      - run: python -m pip check
      - name: Require the approved tag to match package metadata before publishing
        if: inputs.publish_to_pypi
        run: python -c "import importlib.metadata,os; assert os.environ['GITHUB_REF_NAME'] == 'v' + importlib.metadata.version('biosignal-lab'), 'Tag and package version differ'"
      - run: python -m pytest -ra
      - run: python benchmarks/verify.py --output ci-results/numerical.json
      - run: python tools/check_publication.py
      - run: python -m build --outdir dist
      - run: python tools/release_artifacts.py --dist dist --extra all --extra formats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error
  publish:
    if: inputs.publish_to_pypi && startsWith(github.ref, 'refs/tags/v')
    needs: artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/biosignal-lab
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-distributions
          path: verified
      - name: Verify download and stage only Python distributions
        shell: bash
        run: |
          cd verified
          sha256sum --check SHA256SUMS
          mkdir ../dist
          cp ./*.whl ./*.tar.gz ../dist/
      - name: Publish through configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
